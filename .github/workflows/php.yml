name: PHP

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.php'
      - '*.dist'
      - composer.json
      - composer.lock
      - symfony.lock
      - infection.json5
      - .php-cs-fixer.dist.php
      - phpstan.neon
      - .github/workflows/php.yml
  push:
    paths:
      - '**/*.php'
      - '*.dist'
      - composer.json
      - composer.lock
      - symfony.lock
      - infection.json5
      - .php-cs-fixer.dist.php
      - phpstan.neon
      - .github/workflows/php.yml
    branches:
      - trunk

jobs:
  ecs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php
      - name: Run ECS
        run: composer ecs

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php
      - name: Generate PHPStan cache
        run: php bin/console cache:clear
      - name: Run PHPStan
        run: composer phpstan

  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php
      - name: Run PHPUnit
        run: composer phpunit -- --coverage-clover=coverage.xml
      - name: Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml

  infection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php
      - name: Run Infection
        run: composer infection -- --min-msi=95
        env:
          INFECTION_DASHBOARD_API_KEY: ${{ secrets.INFECTION_DASHBOARD_API_KEY }}
