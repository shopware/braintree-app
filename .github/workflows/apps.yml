name: apps

on:
  workflow_dispatch:
  pull_request:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-apps

  app-zip:
    runs-on: ubuntu-latest
    needs: manifest
    strategy:
      fail-fast: false
      matrix:
        version: ['6.7.0.0', '6.6.0.0', '6.5.0.0']
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-apps
      - uses: shopware/shopware-cli-action@v2

      - name: Build extension
        run: shopware-cli extension zip ./apps/${{ matrix.version }} --disable-git --release

      - name: Rename zip
        run: mv ./SwagBraintreeApp.zip SwagBraintreeApp-${{ matrix.version }}.zip

      - name: Validate zip
        shell: bash
        run: shopware-cli extension validate SwagBraintreeApp-${{ matrix.version }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        id: upload
        with:
          name: SwagBraintreeApp-${{ matrix.version }}.zip
          path: SwagBraintreeApp-${{ matrix.version }}.zip

  no-unignored-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-apps

      - name: Check for unignored files
        run: git diff --name-only --exit-code "${{ github.sha }}" -- apps/6.* || (echo "Add the unignored files to ./apps/.gitignore" && exit 1)
