name: JS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.ts'
      - package.json
      - package-lock.json
      - tests/acceptance/**
      - .github/actions/setup-node/action.yml
      - .github/actions/setup-acceptance/action.yml
      - .github/workflows/js.yml
  push:
    paths:
      - '**/*.js'
      - '**/*.ts'
      - package.json
      - package-lock.json
      - tests/acceptance/**
      - .github/actions/setup-node/action.yml
      - .github/actions/setup-acceptance/action.yml
      - .github/workflows/js.yml
    branches:
      - trunk

jobs:
  eslint:
    permissions:
      contents: read
      pull-requests: read
      checks: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - name: Run ESLint
        run: npm run eslint -- --output-file eslint-report.json --format json
        continue-on-error: true
      - name: ESLint report to cli
        run: node -p "require('./node_modules/eslint/lib/cli-engine/formatters/stylish.js')(require('./eslint-report.json'))"
      - name: Annotate ESLint report
        uses: ataylorme/eslint-annotate-action@v4
        with:
          report-json: eslint-report.json

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - name: Run ESLint
        run: npm run tsc

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - name: Run vite
        run: npm run build

  acceptance-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/acceptance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: tests/acceptance/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline
      - name: Run ESLint
        run: npm run lint
      - name: Run type check
        run: npm run tsc
