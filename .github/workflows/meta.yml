name: Meta
on:
  workflow_dispatch:
  pull_request:

jobs:
  app-zip:
    runs-on: ubuntu-latest
    needs: manifest
    strategy:
      fail-fast: false
      matrix:
        version: ['6.7.0.0', '6.6.0.0', '6.5.0.0']
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-apps
      - uses: shopware/shopware-cli-action@v2

      - name: Build extension
        run: shopware-cli extension zip ./apps/${{ matrix.version }} --disable-git --release

      - name: Rename zip
        run: mv ./SwagBraintreeApp.zip SwagBraintreeApp-${{ matrix.version }}.zip

      - name: Validate zip
        shell: bash
        run: shopware-cli extension validate SwagBraintreeApp-${{ matrix.version }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        id: upload
        with:
          name: SwagBraintreeApp-${{ matrix.version }}.zip
          path: SwagBraintreeApp-${{ matrix.version }}.zip

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-apps
      
  doctrine:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.5
        env:
          MARIADB_ROOT_PASSWORD: swagbraintree
          MYSQL_DATABASE: swagbraintree
        ports: ['3306:3306']
    env:
      DATABASE_URL: mysql://root:swagbraintree@127.0.0.1:3306/swagbraintree
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-php

      - name: Migrate database
        run: bin/console doctrine:migrations:migrate --no-interaction

      - name: Validate doctrine schema
        run: bin/console doctrine:schema:validate --verbose