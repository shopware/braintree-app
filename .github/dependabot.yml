version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: 'fix(deps): '
    groups:
      all:
        patterns:
          - '*'
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: 'fix(deps): '
    groups:
      all:
        patterns:
          - '*'
    ignore:
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: 'fix(deps): '
    groups:
      all:
        patterns:
          - '*'
